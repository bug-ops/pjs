# Dependabot configuration for PJS
version: 2
updates:
  # Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/GMT-0"
    open-pull-requests-limit: 10
    ignore:
      # headers-accept 0.3 pins mediatype 0.21; types must match until it updates
      - dependency-name: "mediatype"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch updates
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Fuzz crate (standalone workspace, not covered by the root manifest)
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/GMT-0"
    ignore:
      # headers-accept 0.3 pins mediatype 0.21; types must match until it updates
      - dependency-name: "mediatype"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/GMT-0"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"

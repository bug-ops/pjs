name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A 0.x minor bump is breaking, so minor updates auto-merge only when
      # every updated dependency was already >= 1.0.0; a grouped PR merges
      # only if all of its members qualify.
      - name: Decide auto-merge eligibility
        id: policy
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          auto=$(jq -r '
            length > 0 and all(.[];
              .updateType == "version-update:semver-patch" or
              (.updateType == "version-update:semver-minor" and
                ((.prevVersion // "" | ltrimstr("v") | split(".")[0] | try tonumber catch 0) >= 1)))
          ' <<< "$UPDATED_DEPENDENCIES")
          echo "auto=$auto" >> "$GITHUB_OUTPUT"

      - name: Wait for CI checks to complete
        if: steps.policy.outputs.auto == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: 'Auto-merge'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          allowed-conclusions: success,skipped,neutral

      - name: Enable auto-merge
        if: steps.policy.outputs.auto == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Label updates that need manual review
        if: steps.policy.outputs.auto != 'true'
        run: gh pr edit "$PR_URL" --add-label "major-update"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

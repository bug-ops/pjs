[workspace]
members = ["crates/*"]
default-members = ["crates/pjs-core", "crates/pjs-domain", "crates/pjs-wasm"]
exclude = ["crates/pjs-js-client", "fuzz"]
resolver = "3"

[workspace.package]
documentation = "https://docs.rs/pjson-rs"
version = "0.7.0"
authors = ["Andrei G. <k05h31@gmail.com>"]
readme = "README.md"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/bug-ops/pjs"
keywords = ["json", "streaming", "simd", "performance", "protocol"]
categories = ["encoding", "network-programming", "parser-implementations"]

[workspace.dependencies]
async-stream = "0.3"
axum = "0.8"
brotli = { version = "9", default-features = false, features = ["std"] }
bytes = "1.12"
chrono = "0.4"
clap = "4.6"
console_error_panic_hook = "0.1"
criterion = "0.8"
dashmap = "6.2"
dhat = "0.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
getrandom = "0.4"
headers-accept = "0.3.0"
hmac = "0.13"
hyper = "1.11"
hyper-util = "0.1.20"
jiter = "0.19"
js-sys = "0.3"
jsonwebtoken = { version = "11.0", default-features = false, features = ["use_pem"] }
mediatype = "0.21.0"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
mimalloc = "0.1"
parking_lot = "0.12"
pastey = "0.2"
pjson-rs = { version = "0.7.0", path = "crates/pjs-core" }
pjson-rs-domain = { version = "0.7.0", path = "crates/pjs-domain" }
proptest = "1.11"
rand = "0.10"
rayon = "1.12"
regex = "1.13"
rmp-serde = "1.3"
serde = "1.0"
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
sha2 = "0.11"
smallvec = "1.15"
sonic-rs = "0.5"
subtle = "2.6"
thiserror = "2.0"
tokio = "1.53"
tokio-test = "0.4"
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
tsify = "0.5"
url = "2.5"
uuid = "1.24"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
zstd = { version = "0.14",default-features = false, features = ["zdict_builder"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
manual_div_ceil = "allow"
only_used_in_recursion = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

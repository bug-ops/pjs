<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="PJS encoding: document to frame stream"><rect x="0" y="0" width="900" height="560" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="899" height="559" rx="14" fill="none" stroke="#30363d" stroke-width="1"/><text x="40" y="46" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#e6edf3" font-weight="600" text-anchor="start">How PJS encodes a document</text><text x="40" y="70" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" font-weight="400" text-anchor="start">one JSON document in  →  a skeleton + prioritized patch frames out</text><rect x="40" y="96" width="280" height="330" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="60" y="122" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="11" fill="#6e7681" font-weight="400" text-anchor="start">response.json</text><text x="60" y="150" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#e6edf3" font-weight="400" text-anchor="start">{</text><text x="60" y="170" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#e6edf3" font-weight="400" text-anchor="start">  "user": {</text><text x="60" y="190" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#f0883e" font-weight="400" text-anchor="start">    "id": 12345,</text><text x="60" y="210" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#f0883e" font-weight="400" text-anchor="start">    "name": "Alice",</text><text x="60" y="230" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#d29922" font-weight="400" text-anchor="start">    "profile": {</text><text x="60" y="250" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#d29922" font-weight="400" text-anchor="start">      "bio": "Engineer…",</text><text x="60" y="270" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#d29922" font-weight="400" text-anchor="start">      "stats": { … }</text><text x="60" y="290" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#d29922" font-weight="400" text-anchor="start">    },</text><text x="60" y="310" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#58a6ff" font-weight="400" text-anchor="start">    "posts": [</text><text x="60" y="330" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#58a6ff" font-weight="400" text-anchor="start">      … 1 000 items …</text><text x="60" y="350" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#58a6ff" font-weight="400" text-anchor="start">    ]</text><text x="60" y="370" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#e6edf3" font-weight="400" text-anchor="start">  }</text><text x="60" y="390" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12.5" fill="#e6edf3" font-weight="400" text-anchor="start">}</text><rect x="48" y="178" width="3.5" height="37" rx="1.75" fill="#f0883e"/><rect x="48" y="218" width="3.5" height="77" rx="1.75" fill="#d29922"/><rect x="48" y="298" width="3.5" height="57" rx="1.75" fill="#58a6ff"/><line x1="322" y1="290" x2="352" y2="290" stroke="#8b949e" stroke-width="1.5" stroke-linecap="butt"/><path d="M351,285.5 L358,290 L351,294.5 Z" stroke="none" stroke-width="1" fill="#8b949e" stroke-linejoin="round" stroke-linecap="round"/><rect x="360" y="230" width="170" height="120" rx="12" fill="#1c2128" stroke="#30363d" stroke-width="1"/><text x="445" y="262" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">PJS encoder</text><circle cx="384" cy="283" r="1.8" fill="#3fb950"/><text x="394" y="287" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">derive skeleton</text><circle cx="384" cy="301" r="1.8" fill="#3fb950"/><text x="394" y="305" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">assign priorities</text><circle cx="384" cy="319" r="1.8" fill="#3fb950"/><text x="394" y="323" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" font-weight="400" text-anchor="start">split into frames</text><line x1="532" y1="290" x2="562" y2="290" stroke="#8b949e" stroke-width="1.5" stroke-linecap="butt"/><path d="M561,285.5 L568,290 L561,294.5 Z" stroke="none" stroke-width="1" fill="#8b949e" stroke-linejoin="round" stroke-linecap="round"/><rect x="570" y="96" width="290" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="571" y="97" width="4" height="54" rx="2" fill="#bc8cff" opacity="1"/><text x="588" y="120" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">"@type": "skeleton"</text><rect x="756" y="106" width="92" height="18" rx="9" fill="#bc8cff" opacity="0.14"/><text x="802.0" y="119" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#bc8cff" font-weight="600" text-anchor="middle">@priority 255</text><text x="588" y="140" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>full structure, empty values</tspan></text><rect x="570" y="162" width="290" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="571" y="163" width="4" height="54" rx="2" fill="#f0883e" opacity="1"/><text x="588" y="186" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">"@type": "patch"</text><rect x="756" y="172" width="92" height="18" rx="9" fill="#f0883e" opacity="0.14"/><text x="802.0" y="185" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#f0883e" font-weight="600" text-anchor="middle">@priority 100</text><text x="588" y="206" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>replace </tspan><tspan fill="#f0883e" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace">/user/id  /user/name</tspan></text><rect x="570" y="228" width="290" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="571" y="229" width="4" height="54" rx="2" fill="#d29922" opacity="1"/><text x="588" y="252" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">"@type": "patch"</text><rect x="756" y="238" width="92" height="18" rx="9" fill="#d29922" opacity="0.14"/><text x="802.0" y="251" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#d29922" font-weight="600" text-anchor="middle">@priority 80</text><text x="588" y="272" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>replace </tspan><tspan fill="#d29922" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace">/user/profile</tspan></text><rect x="570" y="294" width="290" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="571" y="295" width="4" height="54" rx="2" fill="#58a6ff" opacity="1"/><text x="588" y="318" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">"@type": "patch"</text><rect x="756" y="304" width="92" height="18" rx="9" fill="#58a6ff" opacity="0.14"/><text x="802.0" y="317" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#58a6ff" font-weight="600" text-anchor="middle">@priority 50</text><text x="588" y="338" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>add </tspan><tspan fill="#58a6ff" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace">/user/posts</tspan><tspan>  · chunk 1/100</tspan></text><rect x="570" y="360" width="290" height="56" rx="8" fill="#161b22" stroke="#6e7681" stroke-width="1" stroke-dasharray="4 3" opacity="0.85"/><rect x="571" y="361" width="4" height="54" rx="2" fill="#6e7681" opacity="0.55"/><text x="588" y="384" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#8b949e" font-weight="400" text-anchor="start">"@type": "patch"</text><rect x="756" y="370" width="92" height="18" rx="9" fill="#6e7681" opacity="0.14"/><text x="802.0" y="383" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6e7681" font-weight="600" text-anchor="middle">@priority 10</text><text x="588" y="404" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>chunks 2–100 keep streaming …</tspan></text><rect x="570" y="426" width="290" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/><rect x="571" y="427" width="4" height="54" rx="2" fill="#3fb950" opacity="1"/><text x="588" y="450" font-family="DejaVu Sans Mono, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e6edf3" font-weight="400" text-anchor="start">"@type": "complete"</text><rect x="756" y="436" width="92" height="18" rx="9" fill="#3fb950" opacity="0.14"/><text x="802.0" y="449" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#3fb950" font-weight="600" text-anchor="middle">final frame</text><text x="588" y="470" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e"><tspan>checksum + stats — document verified</tspan></text><line x1="872" y1="100" x2="872" y2="474" stroke="#6e7681" stroke-width="1.2" stroke-linecap="butt"/><path d="M867.5,473 L872,480 L876.5,473 Z" stroke="none" stroke-width="1" fill="#6e7681" stroke-linejoin="round" stroke-linecap="round"/><text x="884" y="289" transform="rotate(90 884 289)" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#6e7681" text-anchor="middle">network send order</text><text x="40" y="530" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" font-weight="400" text-anchor="start">Patches use JSON Pointer (RFC 6901) · transport-agnostic: HTTP/1.1, HTTP/2, WebSocket, raw TCP</text></svg>
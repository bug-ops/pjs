[package]
name = "pjs-bench"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Comprehensive benchmarking suite for PJS"
keywords = { workspace = true }
categories = { workspace = true }
publish = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
futures = { workspace = true }
jiff = { workspace = true, features = ["std", "serde"] }
pjson-rs = { workspace = true, features = ["websocket-client", "websocket-server"] }
pjson-rs-domain = { workspace = true }
serde_json = { workspace = true }
sonic-rs = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
uuid = { workspace = true }
dhat = { workspace = true }

[lints]
workspace = true

[features]
dhat-heap = []

[[bench]]
name = "simple_throughput"
harness = false

[[bench]]
name = "zero_copy_bench"
harness = false

[[bench]]
name = "serde_overhead_bench"
harness = false

[[bench]]
name = "gat_query_benchmarks"
harness = false

[[bench]]
name = "http_streaming"
harness = false

[[bench]]
name = "http_serve_lifecycle"
harness = false

[[bench]]
name = "websocket_controller"
harness = false

[[bench]]
name = "client_apply_patches"
harness = false

[[bench]]
name = "patch_extraction"
harness = false
